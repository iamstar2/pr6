name: CI

# Trigger stage: push to main (post-merge safety net), every PR targeting main
# (pre-merge gate), and workflow_dispatch (manual re-run). A push AND its PR can
# both fire for the same commit — concurrency below cancels the stale one instead
# of running both to completion.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (rpi5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint deps
        working-directory: rpi5
        run: pip install ruff==0.8.6
      - name: ruff check
        working-directory: rpi5
        run: ruff check .

  test:
    name: Pytest (rpi5)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: rpi5/requirements-dev.txt
      - name: Install dependencies
        working-directory: rpi5
        run: pip install -r requirements-dev.txt
      # Two distinctly-named steps so unit vs integration failures are
      # immediately obvious in the Actions UI — see rpi5/README.md "테스트".
      - name: Unit tests
        working-directory: rpi5
        run: pytest tests/unit -v
      - name: Integration tests
        working-directory: rpi5
        run: pytest tests/integration -v

  web-build:
    name: Build (web)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  esp32-build:
    name: Build (esp32 firmware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install platformio
      # No config.h in the repo (gitignored, per-device secrets) — copy the
      # example so the build has something to compile against. This only proves
      # the code compiles, not that any particular device's Wi-Fi/API key works.
      - run: cp esp32/include/config.h.example esp32/include/config.h
      - run: pio pkg install -d esp32
      # Edge Impulse SDK is vendored, not committed (~24MB — see esp32/SETUP.md);
      # without it this build cannot link. Skips cleanly instead of failing red
      # on every PR until that's addressed.
      - name: Check for vendored Edge Impulse SDK
        id: ei_sdk
        run: |
          if [ -d esp32/lib/Person_detection_FOMO_inferencing ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::esp32/lib/Person_detection_FOMO_inferencing not present in CI (it's gitignored, ~24MB) — skipping firmware build. See esp32/SETUP.md."
          fi
      - if: steps.ei_sdk.outputs.present == 'true'
        run: pio run -d esp32

  # Build & Deploy stage: only after both pytest and the web build succeed, and
  # only for pushes to main (never for PRs) — a PR from a fork shouldn't be able
  # to trigger a build meant to precede deployment. `needs:` means a lint/test
  # failure makes this job show as *skipped*, not failed: broken code physically
  # cannot reach here, it never gets a chance to attempt a build.
  build:
    name: Build & Deploy
    needs: [test, web-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No registry/deploy target is wired up yet (this project has no server to
    # deploy to), so this stops at "does the image build" — a real deploy step
    # would add `environment: production` (+ a required reviewer) and push with
    # `secrets.REGISTRY_TOKEN` below, per the plan in rpi5/README.md.
    steps:
      - uses: actions/checkout@v4
      - name: Build rpi5 Docker image
        run: docker build -f rpi5/Dockerfile -t ppe-rpi5:${{ github.sha }} .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
