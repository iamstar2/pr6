# 데이터 흐름: ESP32 -> receiver:8000 -> inference:8001 -> (violation일 때만) cloud:8002 -> Supabase
services:
  receiver:
    build: ./receiver
    ports:
      - "8000:8000"
    environment:
      INFERENCE_URL: ${INFERENCE_URL:-http://inference:8001}
    env_file:
      - .env
    depends_on:
      - inference
    restart: unless-stopped

  inference:
    build: ./inference
    expose:
      - "8001"
    environment:
      MODEL_PATH: ${MODEL_PATH:-/app/model/best.onnx}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.40}
      IOU_THRESHOLD: ${IOU_THRESHOLD:-0.45}
      NO_HELMET_CLASSES: ${NO_HELMET_CLASSES:-NO-Hardhat,no_helmet,without_helmet}
      NO_VEST_CLASSES: ${NO_VEST_CLASSES:-NO-Safety Vest,no_vest,without_vest}
      PERSON_CLASSES: ${PERSON_CLASSES:-Person,person}
      EVENT_COOLDOWN_SEC: ${EVENT_COOLDOWN_SEC:-5}
      CLOUD_URL: ${CLOUD_URL:-http://cloud:8002}
      MODEL_NAME: ${MODEL_NAME:-PPE-YOLO}
      MODEL_VERSION: ${MODEL_VERSION:-1.0}
    env_file:
      - .env
    volumes:
      # best.onnx는 별도로 생성해야 하며 이미지에는 포함하지 않는다 (용량/보안).
      - ./inference/model:/app/model
    depends_on:
      - cloud
    restart: unless-stopped

  cloud:
    build: ./cloud
    expose:
      - "8002"
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-violations}
      SUPABASE_TABLE: ${SUPABASE_TABLE:-violations}
      MODEL_NAME: ${MODEL_NAME:-PPE-YOLO}
      MODEL_VERSION: ${MODEL_VERSION:-1.0}
    env_file:
      - .env
    restart: unless-stopped
