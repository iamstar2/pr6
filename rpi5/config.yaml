# RPi5 / PC detection server config.
# Model file + class mapping live here so they can change without touching code.

model:
  # Produced by `python scripts/export_model.py` (downloads Hansung-Cho/yolov8-ppe-detection
  # from Hugging Face and exports it to ONNX). Path is relative to rpi5/'s working directory.
  path: ./models/ppe_yolov8n.onnx
  input_size: [640, 640]

# Exact class order the exported ONNX model outputs (index -> label). Regenerated by
# scripts/export_model.py into models/classes.json — kept here too for readability.
classes:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Cone
  7: Safety Vest
  8: machinery
  9: vehicle

inference:
  # If true, or if the ONNX file above is missing, infer_ppe() returns a fixed/random
  # mock PPEResult instead of running the model. Lets ①ESP32 and ④웹 대시보드 be
  # integration-tested without the model file present.
  mock: false
  confidence_threshold: 0.4
  nms_iou_threshold: 0.45
  # "Person" gates every other judgment (no person -> no violation, see
  # inference.py), so it gets its own, stricter bar than helmet/vest classes —
  # a low-confidence "maybe a person" (e.g. a keyboard/desk object the general
  # detector weakly confuses for one) shouldn't be enough to trigger a PPE check.
  person_confidence_threshold: 0.65
