; PlatformIO project config — ESP32-S3 person-detection + capture node
; Board: Seeed XIAO ESP32S3 Sense (OV2640 camera, 8MB PSRAM)
; Arduino IDE is intentionally not used — see docs/esp32-vscode-setup.md

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.partitions = huge_app.csv
board_build.psram_type = opi
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DCAMERA_MODEL_XIAO_ESP32S3
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; The Edge Impulse "Person_detection_FOMO_inferencing" library lives in lib/
; and is picked up automatically by PlatformIO's library dependency finder.
