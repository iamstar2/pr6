<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero-Touch Media Control</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Zero-Touch Media Control</h1>

  <!-- MQTT / 얼굴 인식 상태 표시 -->
  <div id="status-bar">
    <span id="mqtt-status" class="badge waiting">MQTT : WAITING</span>
    <span id="face-status" class="badge not-detected">FACE : NOT DETECTED</span>
  </div>

  <!-- YouTube 검색 -->
  <div id="search-box">
    <input type="text" id="search-input" placeholder="영상 검색어 입력">
    <button id="search-btn">검색</button>
  </div>

  <!-- 검색 결과 썸네일 목록 -->
  <div id="results"></div>

  <!-- YouTube IFrame Player -->
  <div id="player-wrap">
    <div id="player"></div>
  </div>

  <!-- MQTT.js (브라우저용 MQTT over WebSocket 클라이언트) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
